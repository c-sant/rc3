 # Feudal structure and territory.
 game_concept_vassal_desc:0 "Um vassalo é um [ruler|lE] que jurou fidelidade a outro governante, seu [liege|lE].\n\nVassalos têm a [obligation|lE] de fornecer [levies|lE] e pagar [taxes|lE] a seu senhor em troca de proteção.\n\nSe a [opinion|lE] de um vassalo sobre seu senhor for baixa, ele pode se unir a [factions|lE] ou participar de [schemes|lE] para substituí-lo."
 game_concept_ruler_desc:0 "Um governante é um [character|lE] que detém ao menos um [title|lE]."
 game_concept_title_desc:0 "Um título comprova o direito de posse de terras.\n\nA menor unidade territorial do mapa é a [barony|lE]. Baronias se agrupam em [counties|lE]. Condados [de_jure|E] pertencem a um [duchy|lE], ducados a um [kingdom|lE] e reinos a um [empire|lE].\n\nDucados, reinos e impérios nem sempre têm um [holder|lE], mas um governante pode [Concept( 'created', 'criá-los' )|E] se controlar território suficiente."
 game_concept_holder_desc:0 "O titular de um [Concept( 'title', 'título' )|E] é o personagem que o detém. Após o povoamento, os títulos de [Concept( 'barony', 'baronia' )|E] e [Concept( 'county', 'condado' )|E] sempre têm titulares; os títulos de [Concept( 'duchy', 'ducado' )|E], [Concept( 'kingdom', 'reino' )|E] e [Concept( 'empire', 'império' )|E] talvez ainda não tenham sido criados. É possível deter um título de grau elevado sem controlar terras em sua área [Concept( 'de_jure', 'de jure' )|E].\n\nTítulos de grau superior permitem ter [Concept( 'vassals', 'vassalos' )|E] de grau superior. Por exemplo, duques podem ter condes como vassalos, e reis podem ter duques."
 game_concept_de_jure_desc:0 "A maioria dos [titles|lE] integra de jure um título de grau superior, isto é, por direito.\n\nPor exemplo, um [ruler|lE] pode ser [king|lE] da Inglaterra sem que seu [realm|lE] inclua todas as terras legalmente pertencentes à Inglaterra.\n\nO [holder|lE] de um [duchy|lE], [kingdom|lE] ou [empire|lE] sempre tem um [casus_belli|lE] para tomar seus títulos constituintes de jure.\n\nOs [vassals|lE] também determinam quem é seu [rightful_liege|lE] conforme o título ao qual seu [primary_title|lE] pertence de jure."
 game_concept_liege_desc:0 "Um senhor é um [Concept( 'ruler', 'governante' )|E] que tem ao menos um [Concept( 'vassal', 'vassalo' )|E]. Senhores também podem ser vassalos de governantes de grau superior, e assim por diante."
 game_concept_domain_desc:0 "O domínio de um [Concept( 'ruler', 'governante' )|E] reúne todas as [Concept( 'holdings', 'possessões' )|E] que ele detém pessoalmente.\n\nComo o [Concept( 'domain_limit', 'limite de domínio' )|E] varia pouco, governantes precisam contar com [Concept( 'vassals', 'vassalos' )|E] para ampliar seu [Concept( 'realm', 'senhorio' )|E] além de certo ponto."
 game_concept_realm_desc:0 "Um senhorio abrange todas as terras que um [Concept( 'ruler', 'governante' )|E] controla diretamente ou por meio de [Concept( 'vassals', 'vassalos' )|E]. Já o [Concept( 'domain', 'domínio' )|E] inclui apenas as [Concept( 'holdings', 'possessões' )|E] detidas pessoalmente pelo governante."
 game_concept_holding_desc:0 "Uma possessão é o assentamento principal de uma [Concept( 'barony', 'baronia' )|E] ou [Concept( 'county_capital', 'capital condal' )|E].\n\nEla fornece [Concept( 'taxes', 'impostos' )|E] e [Concept( 'levies', 'levas' )|E] a seu [Concept( 'holder', 'titular' )|E] conforme seu [Concept( 'holding_type', 'tipo de possessão' )|E]. As possessões detidas pessoalmente por um [Concept( 'ruler', 'governante' )|E] formam seu [Concept( 'domain', 'domínio' )|E]."
 game_concept_domain_limit_desc:0 "O limite de domínio determina quantas [Concept( 'holdings', 'possessões' )|E] você pode deter legalmente em seu [Concept( 'domain', 'domínio' )|E]. Ele depende de fatores como sua [Concept( 'succession_law', 'lei sucessória' )|E] e o grau de seu [Concept( 'primary_title', 'título principal' )|E].\n\nÉ possível ultrapassar esse limite, mas isso reduz a [Concept( 'income', 'renda' )|E] e a [opinions|El] dos [vassals|El]."

 # Claims and inheritance.
 game_concept_title_claim_desc:0 "Ter um direito sobre um [title|lE] significa ter fundamento legal para detê-lo e fornece um [casus_belli|lE] para conquistá-lo em uma [war|lE]. Direitos também dão motivo válido para [revoke|lE] [titles|lE] de [holders|lE] [Concept( 'vassal', 'vassalos' )|E].\n\nEm geral, [rulers|lE] recebem direitos quando perdem um título para outra pessoa. Também é possível obtê-los pela [Concept( 'fabricate_claim_short', 'fabricação de direitos' )|E].\n\nAlém disso, todos os filhos de um [ruler|lE], inclusive [bastards|lE], têm um [implicit_claim|lE] sobre seus [titles|lE]. Se não herdarem um título após a morte desse governante, esses [implicit_claims|lE] se tornam [Concept( 'pressed_claims', 'direitos firmados' )|E] e podem passar à geração seguinte como [Concept( 'unpressed_claims', 'direitos contestáveis' )|E]."
 game_concept_pressed_claim_desc:0 "Um [claim|lE] firmado tem fundamento jurídico sólido, e os filhos do [claimant|lE] o herdam como [unpressed_claim|lE]."
 game_concept_unpressed_claim_desc:0 "Um [claim|lE] contestável tem fundamento jurídico frágil e não é herdado pelos filhos do [claimant|lE].\n\nNo entanto, direitos contestáveis tornam-se [pressed|lE] se forem usados como [Concept( 'casus_belli', 'casus belli' )|E] para declarar uma [Concept( 'war', 'guerra' )|E], mesmo que a guerra termine em [Concept( 'white_peace', 'paz branca' )|E]."
 game_concept_claimant_desc:0 "Um pretendente é alguém que tem um ou mais [Concept( 'claims', 'direitos' )|E] sobre [Concept( 'titles', 'títulos' )|E]. Um [Concept( 'ruler', 'governante' )|E] pretendente pode reivindicá-los usando o [Concept( 'casus_belli', 'casus belli' )|E] apropriado para declarar [wars|lE].\n\nTambém é possível usar esse casus belli para reivindicar os direitos de [Concept( 'vassals', 'vassalos' )|E] e até de personagens [unlanded|E] de seu [Concept( 'realm', 'senhorio' )|E].\n\nPretendentes também podem liderar [Concept( 'factions', 'facções' )|E] mesmo que não vivam em seu senhorio."
